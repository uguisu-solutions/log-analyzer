[project]
name = "log-analyzer"
version = "0.1.0"
description = "Phase 1 baseline agent (config1 simple-LLM) for the log-driven multi-agent validation platform"
requires-python = ">=3.11"
dependencies = [
    "anthropic>=0.40.0",
    "openai>=1.50.0",
    "langgraph>=0.3.0",
    "pydantic>=2.7",
    "langfuse>=2.50.0,<3.0.0",
    "python-dotenv>=1.0.1",
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "python-multipart>=0.0.20",
    "google-cloud-bigquery>=3.25.0",
    "mcp>=1.2.0",
    "tree-sitter>=0.23.0",
    "tree-sitter-language-pack>=0.7.0",
    "sqlparse>=0.5.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.5",
]

[project.scripts]
log-analyze = "log_analyzer.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/log_analyzer"]

[tool.ruff]
line-length = 100
target-version = "py311"
