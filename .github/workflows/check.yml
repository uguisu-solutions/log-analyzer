# PR と main への push で check（ruff → pytest → tsc → eslint）を流す。
# ローカルの pre-commit を通らずに入った変更（GitHub 上の直接編集など）もここで止める。
name: Check

on:
  pull_request:
  push:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -e "apps/agents[dev]"

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: apps/ui/package-lock.json
      - run: npm ci
        working-directory: apps/ui

      # venv ではなく CI の python を使わせる
      - run: node scripts/check.mjs
        env:
          LOG_ANALYZER_PYTHON: python
