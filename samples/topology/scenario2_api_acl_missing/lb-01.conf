# lb-01 (HAProxy-style) /etc/haproxy/haproxy.cfg
# Last edited: 2026-05-20 by ops01

global
    log         10.1.1.50 local2 info
    daemon
    maxconn     20000

defaults
    log         global
    mode        http
    option      httplog
    option      dontlognull
    timeout     connect 5s
    timeout     client  60s
    timeout     server  60s
    retries     3

# ─── Frontend ────────────────────────────────────────────
frontend https_in
    bind        10.1.1.10:443 ssl crt /etc/ssl/lb-01.pem
    default_backend web_pool
    use_backend  api_pool if { path_beg /api/ }

# ─── Backends ────────────────────────────────────────────
# Both backends are configured to be active; LB sends traffic to both.
# Healthcheck via TCP-level connect every 5s.
backend web_pool
    balance     roundrobin
    option      tcp-check
    server      web-01 10.1.2.20:443 ssl verify none check inter 5s fall 3 rise 2

backend api_pool
    balance     roundrobin
    option      tcp-check
    server      api-01 10.1.2.21:443 ssl verify none check inter 5s fall 3 rise 2

# NOTE (2026-05-20, ops01):
#   api-01 はリリース後の構成変更で追加された。FW 側でも対応ルールが入っている前提。
