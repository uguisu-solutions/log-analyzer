!
! fw-01 (ASA-style) running-config — last modified 2026-05-25 by ops02
! Policy rev: 2026-05-25_001
!
hostname fw-01
domain-name corp.example.com
!
interface outside
 nameif outside
 ip address 203.0.113.1 255.255.255.248
!
interface inside
 nameif inside
 ip address 10.1.1.1 255.255.255.0
!
!
! ─── Object groups ────────────────────────────────────────
object-group network web-backends
 description Pool of web servers behind lb-01
 network-object host 10.1.2.20

object-group network api-backends
 description Pool of API servers behind lb-01
 network-object host 10.1.2.21
!
!
! ─── NAT ─────────────────────────────────────────────────
! Static NAT for inbound services (LB front)
static (inside,outside) 203.0.113.10 10.1.1.10 netmask 255.255.255.255
!
!
! ─── Access list: outside_in ─────────────────────────────
! Inbound traffic from Internet to LB VIP (203.0.113.10)
!
access-list outside_in extended permit tcp any host 203.0.113.10 eq 443
!
! ─── Internal flow: LB → backends ───────────────────────
! LB needs to reach both web and api backend pools
!
access-list inside_out extended permit tcp host 10.1.1.10 object-group web-backends eq 443
!
! NOTE (2026-05-25, ops02):
!   一時的に api-backends 宛て permit ルールを無効化した（インシデント調査用）。
!   調査完了後に必ず復旧すること。本日中に元に戻す予定。
!
! access-list inside_out extended permit tcp host 10.1.1.10 object-group api-backends eq 443
!
access-list inside_out extended deny ip any any log
!
access-group outside_in in interface outside
access-group inside_out in interface inside
!
!
! ─── Logging ─────────────────────────────────────────────
logging enable
logging trap warnings
logging host inside 10.1.1.50
!
end
