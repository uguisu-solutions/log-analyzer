# api-01 /etc/systemd/system/api.service + /etc/api/api.yaml
# Service: corporate API
# Last edited: 2026-05-18 by ops01

# ─── systemd unit ───────────────────────────────────────
[Unit]
Description=Corporate API service (gunicorn)
After=network.target

[Service]
User=api
Group=api
WorkingDirectory=/srv/api
Environment="PYTHONUNBUFFERED=1"
ExecStart=/srv/api/.venv/bin/gunicorn \
    --bind 0.0.0.0:443 \
    --certfile /etc/ssl/api-01.crt \
    --keyfile /etc/ssl/api-01.key \
    --workers 4 \
    --access-logfile /var/log/api/access.log \
    --error-logfile /var/log/api/error.log \
    api.wsgi:application
Restart=on-failure

[Install]
WantedBy=multi-user.target

# ─── api.yaml (抜粋) ─────────────────────────────────────
database:
  host: 10.1.3.30
  port: 5432
  user: api
  database: corp_api
features:
  rate_limit_rps: 100
  auth_required: true
healthcheck:
  path: /healthz
  expected_status: 200
