# web-01 /etc/nginx/conf.d/site.conf
# Service: corporate web frontend
# Last edited: 2026-05-15 by ops01

upstream backend_local {
    server 127.0.0.1:8080;
}

server {
    listen      443 ssl http2;
    server_name web.corp.example.com;

    ssl_certificate     /etc/ssl/web-01.crt;
    ssl_certificate_key /etc/ssl/web-01.key;

    access_log /var/log/nginx/access.log combined;
    error_log  /var/log/nginx/error.log warn;

    location / {
        proxy_pass http://backend_local;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
    }

    # ヘルスチェック (LB 側からの TCP-check が拾う)
    location /healthz {
        access_log off;
        return 200 "ok\n";
    }
}
